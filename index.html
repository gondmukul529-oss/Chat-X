<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CHATX Messenger</title>
    <link rel="stylesheet" href="./style.css">
</head>
<body>

    <section id="authSection" class="auth-section">
        <div class="auth-card">
            <div class="brand-logo">C</div>
            <h1>CHATX</h1>
            <p class="tagline">Connect. Chat. Share.</p>

            <form id="authForm">
                <h2 id="authTitle">Login</h2>

                <input
                    type="email"
                    id="email"
                    placeholder="Email address"
                    autocomplete="email"
                    required
                >

                <input
                    type="password"
                    id="password"
                    placeholder="Password (minimum 6 characters)"
                    autocomplete="current-password"
                    minlength="6"
                    required
                >

                <p id="authMessage" class="status-message"></p>
                <p id="errorMessage" class="error-message"></p>

                <button type="submit" id="authButton">Login</button>
            </form>

            <p class="switch-text">
                <span id="switchLabel">Don't have an account?</span>
                <button type="button" id="switchMode">Sign up</button>
            </p>
        </div>
    </section>

    <main id="dashboard" class="dashboard hidden">

        <aside class="sidebar">

            <header class="sidebar-header">
                <div class="brand">
                    <div class="small-logo">C</div>
                    <h2>CHATX</h2>
                </div>

                <button id="logoutButton" class="logout-button">
                    Logout
                </button>
            </header>

            <div class="profile-card">
                <div id="myAvatar" class="avatar my-avatar">C</div>

                <div class="profile-info">
                    <strong id="myDisplayName">Your Profile</strong>
                    <small id="userEmail"></small>
                </div>
            </div>

            <form id="profileForm" class="profile-form">
                <label for="displayName">Your display name</label>

                <input
                    type="text"
                    id="displayName"
                    placeholder="Enter your name"
                    maxlength="40"
                    required
                >

                <button type="submit" id="saveProfileButton">
                    Save Profile
                </button>

                <p id="profileStatus" class="status-message"></p>
            </form>

            <div class="contacts-heading">
                <h3>Messages</h3>
                <span id="contactCount">0</span>
            </div>

            <input
                type="search"
                id="userSearch"
                class="search-input"
                placeholder="Search people..."
                autocomplete="off"
            >

            <div id="usersList" class="users-list">
                <p class="empty-text">Loading people...</p>
            </div>

        </aside>

        <section class="chat-panel">

            <div id="chatWelcome" class="chat-welcome">
                <div class="welcome-icon">C</div>
                <h1>Welcome to CHATX</h1>
                <p>Select a person from the left to start chatting.</p>
                <span>Simple. Fast. Connected.</span>
            </div>

            <div id="activeChat" class="active-chat hidden">

                <header class="chat-header">
                    <div class="chat-user-info">
                        <div id="chatAvatar" class="avatar">C</div>

                        <div>
                            <h3 id="chatTitle">Select a person</h3>
                            <p id="chatSubtitle">CHATX Messenger</p>
                        </div>
                    </div>
                </header>

                <div id="chatBox" class="chat-box">
                    <p class="empty-text">Your conversation will appear here.</p>
                </div>

                <form id="chatForm" class="chat-form">
                    <input
                        type="text"
                        id="messageInput"
                        placeholder="Type a message..."
                        maxlength="1000"
                        autocomplete="off"
                        required
                    >

                    <button type="submit" id="sendButton">
                        Send
                    </button>
                </form>

                <p id="chatStatus" class="chat-status"></p>

            </div>

        </section>

    </main>

    <script type="module" src="./script.js"></script>

<style>
/* FINAL OVERRIDE - White dabba hatane ke liye */
div[style*="background: white"],
div[style*="background-color: white"],
div[style*="background:#fff"],
div[style*="background: #f8e8e8"],
.pink-box, .user-card {
  background: #1e293b !important;
  border: 1px solid #334155 !important;
  border-radius: 12px !important;
}

/* Jo Anurag wala box hai usko target */
div:has(> div:contains("Anurag")) {
  background: #1e293b !important;
}

/* Better fix - har user item ke liye */
#userList > div, .users-list > div, div.user-item {
  background: #1e293b !important;
  color: white !important;
  border-radius: 12px !important;
  padding: 10px !important;
  margin: 6px 0 !important;
}

#userList > div *, .users-list > div * {
  color: white !important;
  background: transparent !important;
}

/* A wala circle */
#userList > div div:first-child, .avatar {
  background: #25D366 !important;
  color: white !important;
  width: 36px !important;
  height: 36px !important;
  border-radius: 50% !important;
  display: flex !important;
  align-items: center !important;
  justify-content: center !important;
}
    </style>
</body>
</html>
