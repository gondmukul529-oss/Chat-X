<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CHATX Messenger</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <header class="app-header">
        <h1>CHATX</h1>
        <p>Connect. Chat. Share.</p>
    </header>

    <main class="container">

        <section id="authSection" class="card">
            <h2 id="authTitle">Welcome Back</h2>
            <p id="authMessage">Login to continue to CHATX</p>

            <form id="authForm">
                <input
                    type="email"
                    id="email"
                    placeholder="Email address"
                    required
                >

                <input
                    type="password"
                    id="password"
                    placeholder="Password"
                    minlength="6"
                    required
                >

                <button type="submit" id="authButton">Login</button>
            </form>

            <p id="errorMessage" class="status"></p>

            <p>
                <span id="switchLabel">Don't have an account?</span>
                <button type="button" id="switchMode" class="text-button">
                    Sign Up
                </button>
            </p>
        </section>

        <section id="dashboard" class="hidden">

            <div class="card profile-card">
                <h2>Your Profile</h2>

                <p>
                    Logged in as:
                    <strong id="userEmail"></strong>
                </p>

                <form id="profileForm">
                    <input
                        type="text"
                        id="displayName"
                        placeholder="Choose your display name"
                        maxlength="40"
                        required
                    >

                    <button type="submit" id="saveProfileButton">
                        Save Profile
                    </button>
                </form>

                <p id="profileEmail"></p>
                <p id="profileStatus" class="status"></p>
            </div>

            <div class="chat-layout">

                <aside class="card users-card" id="usersSection">
                    <h2>People</h2>
                    <p>Choose someone to chat with.</p>

                    <div id="usersList">
                        <p>Loading users...</p>
                    </div>
                </aside>

                <section class="card chat-card">
                    <div class="chat-heading">
                        <div>
                            <h2 id="chatTitle">CHATX Chat</h2>
                            <p id="chatSubtitle">
                                Select a user to start chatting.
                            </p>
                        </div>
                    </div>

                    <div id="chatBox" class="chat-box">
                        <p class="empty-message">
                            Your messages will appear here.
                        </p>
                    </div>

                    <form id="chatForm" class="chat-form">
                        <input
                            type="text"
                            id="messageInput"
                            placeholder="Type a message..."
                            maxlength="1000"
                            autocomplete="off"
                            required
                        >

                        <button type="submit" id="sendButton">
                            Send
                        </button>
                    </form>

                    <p id="chatStatus" class="status"></p>
                </section>

            </div>

            <button type="button" id="logoutButton" class="logout-button">
                Logout
            </button>

        </section>

    </main>

    <footer>
        <p>CHATX Messenger &copy; 2026</p>
    </footer>

    <script type="module" src="script.js"></script>

</body>
</html>
