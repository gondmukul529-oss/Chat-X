<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CHATX Messenger</title>
    <link rel="stylesheet" href="style.css">
    <style>
        #chatBox {
            height: 300px;
            overflow-y: auto;
            border: 1px solid #ccc;
            padding: 10px;
            margin: 15px 0;
            border-radius: 10px;
            text-align: left;
        }
        .message {
            background: #e8f0ff;
            padding: 9px;
            border-radius: 8px;
            margin: 8px 0;
            overflow-wrap: anywhere;
        }
        .message small {
            display: block;
            color: #555;
            margin-bottom: 4px;
        }
        #chatForm {
            display: flex;
            gap: 8px;
        }
        #chatForm input {
            flex: 1;
            min-width: 0;
        }
        #chatStatus {
            overflow-wrap: anywhere;
        }
    </style>
</head>
<body>
<div class="app">
    <header>
        <h1>CHAT<span>X</span></h1>
        <p>Connect. Chat. Repeat.</p>
    </header>

    <section id="authSection">
        <h2 id="authTitle">Welcome Back</h2>
        <p id="authMessage">Login to continue to CHATX</p>

        <form id="authForm">
            <input type="email" id="email" placeholder="Email address"
                autocomplete="email" required>

            <input type="password" id="password"
                placeholder="Password (minimum 6 characters)"
                autocomplete="current-password" minlength="6" required>

            <button type="submit" id="authButton">Login</button>
        </form>

        <p id="errorMessage" role="alert"></p>

        <p class="switchText">
            <span id="switchLabel">Don't have an account?</span>
            <button type="button" id="switchMode">Sign Up</button>
        </p>
    </section>

    <section id="dashboard" class="hidden">
        <h2>CHATX Global Chat</h2>
        <div id="usersSection">
    <h3>Users</h3>
    <p>Registered CHATX users</p>
    <div id="usersList">
        <p>Loading users...</p>
    </div>
        </div>
        <div id="profileSection">
    <h3>My Profile</h3>
    <p id="profileEmail"></p>

    <form id="profileForm">
        <input
            type="text"
            id="displayName"
            placeholder="Enter your name"
            maxlength="40"
            required
        >
        <button type="submit" id="saveProfileButton">
            Save Profile
        </button>
    </form>

    <p id="profileStatus" role="status"></p>
        </div>
        <p>Logged in as: <span id="userEmail"></span></p>

        <div id="chatBox" aria-live="polite">
            <p>Loading messages...</p>
        </div>

        <form id="chatForm">
            <input type="text" id="messageInput"
                placeholder="Type a message..."
                maxlength="1000" required>
            <button type="submit" id="sendButton">Send</button>
        </form>

        <p id="chatStatus" role="status"></p>
        <button id="logoutButton" type="button">Logout</button>
    </section>

    <footer>CHATX © 2026</footer>
</div>

<script type="module" src="script.js"></script>
</body>
</html>
